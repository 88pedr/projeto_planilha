services:
  mysql:
    image: mysql:8
    # restart: always reinicia o container automaticamente em caso de falha/parada.
    restart: always
    ports:
      - "${PORTA1}"
    volumes:
      # Persiste os dados do MySQL no diretório local do projeto.
      - ./database_pedro:/var/lib/mysql
    environment:
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${SENHAS}
      MYSQL_ROOT_PASSWORD: ${SENHAS}
      MYSQL_DATABASE: ${DATABASE}
    env_file:
      - .env

  streamlit:
    build: .
    container_name: Planilha_Financeira
    ports:
      - "${PORTA2}"
    env_file:
      - .env
    environment:
      HOST: ${HOST}
      DATABASE: ${DATABASE}
      DB_USER: ${DB_USER}
      SENHAS: ${SENHAS}
    depends_on:
      - mysql

