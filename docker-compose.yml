version: '3.8'
services:
 mysql:
   image: mysql:8
#restart defines the policy that the platform applies on container termination.
#no: The default restart policy. It does not restart the container under any circumstances.
#always: The policy always restarts the container until its removal.
#on-failure[:max-retries]: The policy restarts the container if the exit code indicates an error. Optionally, limit the number of restart retries the Docker daemon attempts.
#unless-stopped: The policy restarts the container irrespective of the exit code but stops restarting when the service is stopped or removed.
   restart: always
   #padrão porta pega no mesmo site, tudo para sabermos qual
   ports: 
    - "3306:3306" 
  #onde ele vai armazerna os conteudo salvos
   volumes:
    - .\MySQL\MySQL Server 26.10\Data
    #basicamente algumas config/contexto que o docker vai rodar, VARIAVEIS
   environment: 
     #vai rodar no fuso horario da Bahia
    -USER: usuario
    -PASSWORD: senha_forte
    -PASSWORDROOT: senha_admin
    -DATABASE: db
   

 